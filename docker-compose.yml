version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secret-santa-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - secret-santa-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: secret-santa-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - secret-santa-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: secret-santa-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: secret_santa
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: secret_santa
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - secret-santa-network
    ports:
      - "3307:3306"

networks:
  secret-santa-network:
    driver: bridge

volumes:
  db_data:
    driver: local
